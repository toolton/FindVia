<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FindVia - Find Local Work & Services</title>

  <meta name="description" content="FindVia connects people with local workers and services quickly and easily.">

  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <header>
    <div class="logo">FindVia</div>

    <div class="language-switcher">
      <button>English</button>
      <button>हिन्दी</button>
    </div>
  </header>

  <main>

    <section class="hero">
      <h1>Find Local Work.<br>Get Work Done.</h1>

      <p>
        Find trusted local workers or get local jobs near you.
      </p>

      <div class="hero-buttons">
        <button>Find a Worker</button>
        <button>Post a Job</button>
      </div>
    </section>

    <section class="services">

      <h2>Popular Services</h2>

      <div class="service-grid">

        <div class="service-card">
          <span>🧹</span>
          <p>Cleaning</p>
        </div>

        <div class="service-card">
          <span>🔧</span>
          <p>Plumbing</p>
        </div>

        <div class="service-card">
          <span>⚡</span>
          <p>Electrician</p>
        </div>

        <div class="service-card">
          <span>📦</span>
          <p>Delivery</p>
        </div>

        <div class="service-card">
          <span>🛠️</span>
          <p>Repair</p>
        </div>

        <div class="service-card">
          <span>➕</span>
          <p>Other</p>
        </div>

      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 FindVia. All rights reserved.</p>
  </footer>
<script src="assets/js/app.js"></script>
</body>
</html>
