<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FindVia - Find Work. Find Workers.</title>

    <meta name="description" content="FindVia helps people find local work and workers easily.">
    <meta name="theme-color" content="#2563eb">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="logo">FindVia</div>

        <button class="language-btn" onclick="toggleLanguage()">
            हिंदी / EN
        </button>
    </header>


    <!-- Main App -->
    <main>

        <!-- Welcome Section -->
        <section class="welcome">
            <h1 id="welcomeTitle">Find Work. Find Workers.</h1>

            <p id="welcomeText">
                Find trusted local work and workers near you.
            </p>
        </section>


        <!-- Location -->
        <section class="location-box">
            <span>📍</span>
            <div>
                <small>Your Location</small>
                <strong id="locationText">Select your location</strong>
            </div>

            <button onclick="selectLocation()">Change</button>
        </section>


        <!-- Main Actions -->
        <section class="action-grid">

            <button class="action-card" onclick="findWork()">
                <span class="action-icon">🔎</span>
                <h2 id="findWorkTitle">Find Work</h2>
                <p id="findWorkText">
                    Discover local jobs and work opportunities.
                </p>
            </button>


            <button class="action-card" onclick="findWorkers()">
                <span class="action-icon">🧑‍🔧</span>
                <h2 id="findWorkersTitle">Find Workers</h2>
                <p id="findWorkersText">
                    Find people for your work or service.
                </p>
            </button>

        </section>


        <!-- Post Job -->
        <section class="post-section">

            <h2 id="postTitle">Need someone for a job?</h2>

            <p id="postText">
                Post your work requirement and find the right person.
            </p>

            <button class="primary-btn" onclick="postJob()" id="postButton">
                + Post a Job
            </button>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <button onclick="goHome()">
            <span>🏠</span>
            <small id="homeNav">Home</small>
        </button>

        <button onclick="findWork()">
            <span>🔎</span>
            <small id="searchNav">Search</small>
        </button>

        <button onclick="postJob()" class="nav-post">
            <span>＋</span>
            <small id="postNav">Post</small>
        </button>

        <button onclick="showProfile()">
            <span>👤</span>
            <small id="profileNav">Profile</small>
        </button>

    </nav>


    <script src="script.js"></script>

</body>
</html>
